name: Export Review Logs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
    concurrency:
      group: export-review-logs
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.4.2-
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Export review logs
        env:
          PROD_USER_UID: ${{ secrets.PROD_USER_UID }}
        run: bun run calibrate:export --out calibration-out

      - name: Calibration report
        run: bun run calibrate:report calibration-out/reviews.json --out calibration-out/report.json

      - name: Upload calibration artifact
        uses: actions/upload-artifact@v7
        with:
          name: calibration-export
          path: calibration-out/
          retention-days: 30

      - name: Notify calibration threshold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run calibrate:issue calibration-out/report.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
